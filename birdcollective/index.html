<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bird Collective — catalog mirror</title>
<style>
  :root {
    --bg: #faf8f3; --fg: #1d1c1a; --muted: #6b675f; --line: #e3ded3; --card: #fff;
    --accent: #2f5d50; --sale: #b8452f; --chip: #efebe2; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 14px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --fg: #ece8df; --muted: #9d978b; --line: #2d2b27; --card: #1d1c19;
      --accent: #8cc4ae; --sale: #f08a70; --chip: #262420; --shadow: 0 1px 2px rgb(0 0 0 / .4);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }

  header.top {
    position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; padding: 10px 20px;
  }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .brand small { font: 12px system-ui, sans-serif; color: var(--muted); margin-left: 6px; font-weight: 400; }
  .search { flex: 1; max-width: 420px; margin-left: auto; }
  .search input, select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
  }
  select { width: auto; border-radius: 8px; padding: 6px 10px; }
  .menu-btn { display: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 28px; padding: 20px; max-width: 1500px; margin: 0 auto; }
  nav.side { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; padding-right: 6px; }
  nav.side h4 { margin: 18px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  nav.side h4:first-child { margin-top: 0; }
  nav.side a { display: flex; justify-content: space-between; text-decoration: none; padding: 3px 10px; border-radius: 6px; font-size: 14px; }
  nav.side a span { color: var(--muted); font-size: 12px; }
  nav.side a:hover { background: var(--chip); }
  nav.side a.on { background: var(--accent); color: var(--bg); }
  nav.side a.on span { color: inherit; opacity: .8; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 16px; }
  .bar h1 { margin: 0; font-family: Georgia, serif; font-size: 28px; }
  .bar .count { color: var(--muted); }
  .bar .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .bar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px 18px; }
  .card { text-decoration: none; display: block; }
  .card .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .25s; }
  .card img.alt { opacity: 0; }
  @media (hover: hover) { .card:hover img.alt { opacity: 1; } }
  .card .t { margin-top: 8px; font-size: 14px; line-height: 1.35; }
  .price { font-weight: 600; }
  .price s { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .price.sale { color: var(--sale); }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--fg); color: var(--bg); z-index: 1; }
  .badge.sale { background: var(--sale); color: #fff; }
  .empty { color: var(--muted); padding: 40px 0; }

  /* product view */
  .pv { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--fg); }
  .main-img { aspect-ratio: 1; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); cursor: zoom-in; }
  .main-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumbs button { width: 68px; height: 68px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--card); cursor: pointer; }
  .thumbs button.on { border-color: var(--accent); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pv h1 { font-family: Georgia, serif; font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
  .pv .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .pv .price { font-size: 22px; }
  .opt { margin: 18px 0; }
  .opt b { display: block; font-size: 13px; margin-bottom: 6px; }
  .vals { display: flex; flex-wrap: wrap; gap: 6px; }
  .vals button { border: 1px solid var(--line); background: var(--card); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .vals button.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .vals button.na { color: var(--muted); text-decoration: line-through; }
  .stock { font-size: 14px; margin: 10px 0 18px; }
  .stock.no { color: var(--sale); }
  .cta { display: inline-block; background: var(--accent); color: var(--bg); padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .desc { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 14px; }
  .desc img, .desc iframe { max-width: 100%; height: auto; }
  .desc table { border-collapse: collapse; font-size: 13px; }
  .desc td, .desc th { border: 1px solid var(--line); padding: 4px 8px; }
  .cats { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .cats a { font-size: 12px; background: var(--chip); padding: 2px 10px; border-radius: 999px; text-decoration: none; }

  .lb { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .92); display: none; align-items: center; justify-content: center; }
  .lb.open { display: flex; }
  .lb img { max-width: 96vw; max-height: 94vh; object-fit: contain; }
  .lb button { position: absolute; background: none; border: 0; color: #fff; font-size: 38px; cursor: pointer; padding: 16px; }
  .lb .x { top: 0; right: 4px; }
  .lb .prev { left: 0; } .lb .next { right: 0; }

  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 30px 20px 40px; }

  @media (max-width: 860px) {
    .menu-btn { display: block; }
    .layout { grid-template-columns: 1fr; padding: 14px; }
    nav.side { display: none; position: fixed; inset: 57px 0 0 0; max-height: none; background: var(--bg); z-index: 15; padding: 16px 20px; }
    body.menu nav.side { display: block; }
    .pv { grid-template-columns: 1fr; gap: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 12px; }
    .brand small { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" aria-label="Categories" onclick="document.body.classList.toggle('menu')">☰</button>
  <a class="brand" href="#/">Bird Collective <small>catalog mirror</small></a>
  <div class="search"><input id="q" type="search" placeholder="Search products…" autocomplete="off"></div>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="view"><p class="empty">Loading…</p></main>
</div>
<div class="lb" id="lb">
  <button class="x" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous">‹</button>
  <img alt="">
  <button class="next" aria-label="Next">›</button>
</div>
<footer id="foot"></footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + n.toFixed(2).replace(/\.00$/, '');
const img = (f, thumb) => `img/${f}${thumb ? '-t' : ''}.avif`;

let D, byId = new Map(), byHandle = new Map(), catsOf = new Map();
const state = { sort: 'featured', avail: false };

function priceInfo(p) {
  const ps = p.variants.map(v => v.p), min = Math.min(...ps), max = Math.max(...ps);
  const v = p.variants.find(v => v.p === min);
  const cmp = v.c && v.c > v.p ? v.c : null;
  return { min, max, cmp, avail: p.variants.some(v => v.a) };
}
function priceHtml(p) {
  const { min, max, cmp } = priceInfo(p);
  const txt = (min !== max ? 'from ' : '') + money(min);
  return `<span class="price${cmp ? ' sale' : ''}">${txt}${cmp ? `<s>${money(cmp)}</s>` : ''}</span>`;
}

function renderNav(active) {
  let h = `<h4>Browse</h4><a href="#/" class="${active === '' ? 'on' : ''}">All products <span>${D.products.length}</span></a>`;
  let g = null;
  for (const c of D.nav) {
    if (c.group !== g) { g = c.group; h += `<h4>${esc(g)}</h4>`; }
    h += `<a href="#/c/${c.handle}" class="${active === c.handle ? 'on' : ''}">${esc(c.label)} <span>${c.ids.length}</span></a>`;
  }
  $('#nav').innerHTML = h;
}

function sortList(list) {
  const l = [...list];
  const pi = p => priceInfo(p).min;
  if (state.sort === 'price-asc') l.sort((a, b) => pi(a) - pi(b));
  else if (state.sort === 'price-desc') l.sort((a, b) => pi(b) - pi(a));
  else if (state.sort === 'az') l.sort((a, b) => a.title.localeCompare(b.title));
  else if (state.sort === 'new') l.sort((a, b) => b.created.localeCompare(a.created));
  return state.avail ? l.filter(p => priceInfo(p).avail) : l;
}

function card(p) {
  const { cmp, avail } = priceInfo(p);
  const [a, b] = p.images;
  const badge = !avail ? '<span class="badge">Sold out</span>' : cmp ? '<span class="badge sale">Sale</span>' : '';
  return `<a class="card" href="#/p/${p.handle}">
    <div class="ph">${badge}${a ? `<img src="${img(a.f, 1)}" alt="${esc(p.title)}" loading="lazy" decoding="async">` : ''}
    ${b ? `<img class="alt" src="${img(b.f, 1)}" alt="" loading="lazy" decoding="async">` : ''}</div>
    <div class="t">${esc(p.title)}</div>${priceHtml(p)}</a>`;
}

function renderList(title, list) {
  const shown = sortList(list);
  $('#view').innerHTML = `
    <div class="bar"><h1>${esc(title)}</h1><span class="count">${shown.length} products</span>
      <div class="tools">
        <label><input type="checkbox" id="avail" ${state.avail ? 'checked' : ''}> In stock only</label>
        <select id="sort">
          ${[['featured','Featured'],['new','Newest'],['price-asc','Price: low → high'],['price-desc','Price: high → low'],['az','A → Z']]
            .map(([v, t]) => `<option value="${v}" ${state.sort === v ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div></div>
    ${shown.length ? `<div class="grid">${shown.map(card).join('')}</div>` : '<p class="empty">No products found.</p>'}`;
  $('#sort').onchange = e => { state.sort = e.target.value; route(); };
  $('#avail').onchange = e => { state.avail = e.target.checked; route(); };
}

function renderProduct(p) {
  const opts = p.options;
  const first = p.variants.find(v => v.a) || p.variants[0];
  let sel = first.t.split(' / ');
  let cur = 0;
  const galleryIdx = () => {
    const v = currentVariant();
    const i = v ? p.images.findIndex(im => im.v.includes(v.id)) : -1;
    return i;
  };
  const currentVariant = () => p.variants.find(v => v.t === sel.join(' / ')) || null;

  $('#view').innerHTML = `
    <a class="back" href="javascript:history.back()">← Back</a>
    <div class="pv">
      <div>
        <div class="main-img" id="main">${p.images[0] ? `<img src="${img(p.images[0].f)}" alt="${esc(p.title)}">` : ''}</div>
        ${p.images.length > 1 ? `<div class="thumbs" id="thumbs">${p.images.map((im, i) =>
          `<button data-i="${i}" aria-label="Photo ${i + 1}"><img src="${img(im.f)}" loading="lazy" alt=""></button>`).join('')}</div>` : ''}
      </div>
      <div>
        <h1>${esc(p.title)}</h1>
        <div class="meta">${esc([p.type, p.vendor].filter(Boolean).join(' · '))}</div>
        <div id="price"></div>
        <div id="opts"></div>
        <div id="stock"></div>
        <a class="cta" href="${D.source}/products/${p.handle}" target="_blank" rel="noopener">View on birdcollective.com ↗</a>
        <div class="cats">${(catsOf.get(p.id) || []).map(c => `<a href="#/c/${c.handle}">${esc(c.label)}</a>`).join('')}</div>
        <div class="desc">${p.body || ''}</div>
      </div>
    </div>`;

  const show = i => {
    cur = i;
    if (!p.images[i]) return;
    $('#main img').src = img(p.images[i].f);
    document.querySelectorAll('#thumbs button').forEach((b, j) => b.classList.toggle('on', j === i));
  };
  const update = () => {
    const v = currentVariant();
    $('#price').innerHTML = v
      ? `<span class="price${v.c && v.c > v.p ? ' sale' : ''}">${money(v.p)}${v.c && v.c > v.p ? `<s>${money(v.c)}</s>` : ''}</span>`
      : priceHtml(p);
    $('#stock').innerHTML = !v ? '<div class="stock no">Unavailable combination</div>'
      : v.a ? '<div class="stock">In stock</div>' : '<div class="stock no">Sold out</div>';
    $('#opts').innerHTML = opts.map((o, oi) => `<div class="opt"><b>${esc(o.name)}: ${esc(sel[oi] || '')}</b><div class="vals">${
      o.values.map(val => {
        const test = sel.slice(); test[oi] = val;
        const vv = p.variants.find(x => x.t === test.join(' / '));
        return `<button data-o="${oi}" data-v="${esc(val)}" class="${sel[oi] === val ? 'on' : ''} ${!vv || !vv.a ? 'na' : ''}">${esc(val)}</button>`;
      }).join('')}</div></div>`).join('');
    const gi = galleryIdx();
    if (gi >= 0) show(gi);
  };
  $('#opts').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    sel[+b.dataset.o] = b.dataset.v; update();
  };
  const th = $('#thumbs');
  if (th) th.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  $('#main').onclick = () => openLb(p.images, cur);
  show(0); update();
  document.title = `${p.title} — Bird Collective mirror`;
}

// lightbox
let lbImgs = [], lbI = 0;
const lb = $('#lb');
function openLb(imgs, i) { if (!imgs.length) return; lbImgs = imgs; lbI = i; lb.classList.add('open'); lbShow(); }
function lbShow() { $('img', lb).src = img(lbImgs[lbI].f); }
lb.onclick = e => {
  if (e.target.classList.contains('prev')) { lbI = (lbI - 1 + lbImgs.length) % lbImgs.length; lbShow(); }
  else if (e.target.classList.contains('next')) { lbI = (lbI + 1) % lbImgs.length; lbShow(); }
  else lb.classList.remove('open');
};
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') lb.classList.remove('open');
  if (e.key === 'ArrowLeft') { lbI = (lbI - 1 + lbImgs.length) % lbImgs.length; lbShow(); }
  if (e.key === 'ArrowRight') { lbI = (lbI + 1) % lbImgs.length; lbShow(); }
});

function route() {
  document.body.classList.remove('menu');
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const q = $('#q').value.trim().toLowerCase();
  let m;
  if ((m = h.match(/^\/p\/(.+)/)) && byHandle.has(m[1])) {
    renderNav(null); renderProduct(byHandle.get(m[1])); scrollTo(0, 0); return;
  }
  document.title = 'Bird Collective — catalog mirror';
  if (q) {
    renderNav(null);
    const words = q.split(/\s+/);
    renderList(`Search: “${q}”`, D.products.filter(p => {
      const hay = `${p.title} ${p.type} ${p.vendor}`.toLowerCase();
      return words.every(w => hay.includes(w));
    }));
    return;
  }
  if ((m = h.match(/^\/c\/(.+)/))) {
    const c = D.nav.find(c => c.handle === m[1]);
    if (c) { renderNav(c.handle); renderList(c.label, c.ids.map(i => byId.get(i))); return; }
  }
  renderNav(''); renderList('All products', D.products);
}

let qt;
$('#q').oninput = () => {
  clearTimeout(qt);
  qt = setTimeout(() => { if (/^#\/p\//.test(location.hash)) location.hash = '#/'; else route(); }, 150);
};

fetch('data.json').then(r => r.json()).then(d => {
  D = d;
  for (const p of D.products) { byId.set(p.id, p); byHandle.set(p.handle, p); }
  for (const c of D.nav) for (const id of c.ids) {
    if (!catsOf.has(id)) catsOf.set(id, []);
    catsOf.get(id).push(c);
  }
  $('#foot').innerHTML = `Unofficial mirror of <a href="${D.source}" target="_blank" rel="noopener">birdcollective.com</a>,
    snapshot from ${D.fetched}. Prices in USD. All product names, photos and descriptions © Bird Collective.`;
  addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
